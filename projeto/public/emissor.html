<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Emissor de localização</title>
  <style>
    body {
      margin: 0;
      font-family: Roboto, Arial, sans-serif;
      background: #f1f3f4;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
      padding: 24px;
      width: 320px;
      text-align: center;
    }

    h2 {
      margin: 0 0 16px;
      color: #202124;
    }

    p {
      color: #5f6368;
      margin: 6px 0;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      color: #fff;
      background: #1a73e8;
      cursor: pointer;
      margin-top: 12px;
    }

    button.parar {
      background: #ea4335;
    }

    .ponto {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #9aa0a6;
      margin-right: 6px;
    }

    .ponto.on {
      background: #34a853;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Transmitindo localização</h2>
    <p><span class="ponto" id="ponto"></span><span id="conexao">Desconectado</span></p>
    <p id="pos">Aguardando GPS…</p>
    <p id="envios">Envios: 0</p>
    <button id="btn">Iniciar transmissão</button>
  </div>

  <script>
    const CHAVE = 'troque-esta-chave';
    let ws, watchId = null, envios = 0, wakeLock = null;

    function conectar() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}`);

      ws.onopen = () => {
        document.getElementById('conexao').textContent = 'Conectado';
        document.getElementById('ponto').classList.add('on');
      };

      ws.onclose = () => {
        document.getElementById('conexao').textContent = 'Reconectando…';
        document.getElementById('ponto').classList.remove('on');
        setTimeout(conectar, 2000);
      };
    }

    conectar();

    function enviar(pos) {
      const c = pos.coords;
      document.getElementById('pos').textContent = `${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)} (±${Math.round(c.accuracy)} m)`;

      if (ws.readyState !== 1) return;

      ws.send(JSON.stringify({
        tipo: 'posicao',
        chave: CHAVE,
        lat: c.latitude,
        lng: c.longitude,
        precisao: c.accuracy,
        velocidade: c.speed,
        rumo: c.heading
      }));

      document.getElementById('envios').textContent = `Envios: ${++envios}`;
    }

    async function iniciar() {
      watchId = navigator.geolocation.watchPosition(
        enviar,
        (err) => document.getElementById('pos').textContent = 'Erro de GPS: ' + err.message,
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );

      try {
        wakeLock = await navigator.wakeLock?.request('screen');
      } catch {}

      btn.textContent = 'Parar transmissão';
      btn.classList.add('parar');
    }

    function parar() {
      navigator.geolocation.clearWatch(watchId);
      watchId = null;
      wakeLock?.release();
      wakeLock = null;
      btn.textContent = 'Iniciar transmissão';
      btn.classList.remove('parar');
    }

    const btn = document.getElementById('btn');
    btn.onclick = () => watchId === null ? iniciar() : parar();
  </script>
</body>
</html>
